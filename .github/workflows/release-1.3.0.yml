name: Publicar Esportes-Dash 1.3.0

on:
  schedule:
    # 18/11/2026, 08:00 America/Sao_Paulo = 11:00 UTC.
    # The script prevents publication before this time or in later years.
    - cron: '0 11 18 11 *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.3.0.yml'
      - 'tools/publish_release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v1.3.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ernanimarcondes/Esportes-Dash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate or publish the reviewed release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_release.py
